<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>RDWC v4 — Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
 body{background:#0b0f14;color:#e6edf3;font-family:system-ui,Segoe UI,Roboto,Arial}
 .wrap{max-width:1100px;margin:24px auto;padding:0 12px}
 h1{font-weight:700;font-size:22px;margin:0 0 14px}
 .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
 .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px}
 .row{display:flex;gap:10px;align-items:center;margin:6px 0}
 button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
 .on{background:#10b981;color:#062314}
 .off{background:#ef4444;color:#2c0c0c}
 .kv{font-variant-numeric:tabular-nums}
 .cam{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
 .muted{color:#9ca3af;font-size:12px}
 table{width:100%;border-collapse:collapse}
 th,td{border-bottom:1px solid #1f2937;padding:6px 8px;text-align:left}
 .relay-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
 .relay{display:flex;align-items:center;justify-content:center;border-radius:10px;padding:10px 8px;font-weight:700;cursor:pointer;border:1px solid #1f2937}
 .relay.on{background:#10b981;color:#062314}
 .relay.off{background:#ef4444;color:#2c0c0c}
</style>
</head>
<body>
<div class="wrap">
  <h1>RDWC v4 — Dashboard</h1>
  <div class="grid">
    <div class="card">
      <h3>Sensors</h3>
      <div class="row kv">Temp: <b id="temp">—</b> °C</div>
      <div class="row kv">pH: <b id="ph">—</b></div>
      <div class="row kv">EC: <b id="ec">—</b> mS/cm</div>
      <div class="muted">Updates every 10s • <span id="age">—</span>s ago</div>
      <h3 style="margin-top:16px;">Relays</h3>
      <div id="relays" class="relay-grid"></div>
      <div class="muted">Active map: ph_up, grow_pump, micro_pump, bloom_pump, main_pump, chiller_pump, water_chiller, grow_lights</div>
    </div>
    <div class="card">
      <h3>Camera</h3>
      <div class="cam">
        <img id="cam" src="/cam.jpg" style="width:100%;border-radius:10px"/>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3>Recent Readings</h3>
    <table id="hist"><thead><tr><th>Time</th><th>Temp (°C)</th><th>pH</th><th>EC (mS/cm)</th></tr></thead><tbody></tbody></table>
  </div>
  
  <div class="card" style="margin-top:16px;">
    <h3>Trends (last 6h)</h3>
    <canvas id="chartTemp" height="120"></canvas>
    <canvas id="chartPh"   height="120" style="margin-top:10px;"></canvas>
    <canvas id="chartEc"   height="120" style="margin-top:10px;"></canvas>
  </div>
</div>
<script>
const NO_CACHE = { cache: 'no-store', headers: { 'Cache-Control': 'no-store' } };
const bust = () => `t=${Date.now()}`;

let ct, ch, ce; // chart instances
function mkChart(ctx,label){
  return new Chart(ctx,{type:'line',data:{labels:[],datasets:[{label,borderWidth:1,pointRadius:0}]},
    options:{animation:false, responsive:true, scales:{x:{display:false}}}});
}
async function updateCharts(){
  const rows = await (await fetch(`/history_window?hours=6&${Date.now()}`, {cache:'no-store'})).json();
  const xs = rows.map(r => new Date(r.ts*1000).toLocaleTimeString()).reverse();
  const t  = rows.map(r => r.temp_c).reverse();
  const p  = rows.map(r => r.ph).reverse();
  const e  = rows.map(r => r.ec_ms_cm).reverse();
  if(!ct){ ct = mkChart(document.getElementById('chartTemp').getContext('2d'), 'Temp (°C)'); }
  if(!ch){ ch = mkChart(document.getElementById('chartPh').getContext('2d'),   'pH'); }
  if(!ce){ ce = mkChart(document.getElementById('chartEc').getContext('2d'),   'EC (mS/cm)'); }
  const apply=(chart,data)=>{ chart.data.labels=xs; chart.data.datasets[0].data=data; chart.update('none'); };
  apply(ct,t); apply(ch,p); apply(ce,e);
}

async function refresh(){
  // sensor status
  const s = await (await fetch(`/status?${bust()}`, NO_CACHE)).json();
  document.getElementById('temp').textContent = s.temp_c?.toFixed?.(3) ?? '—';
  document.getElementById('ph').textContent = s.ph?.toFixed?.(3) ?? '—';
  document.getElementById('ec').textContent = s.ec_ms_cm?.toFixed?.(1) ?? '—';
  document.getElementById('age').textContent = s.age_s ?? '—';

  // pump legacy buttons (if present)
  try {
    const p = await (await fetch(`/pump/status?${bust()}`, NO_CACHE)).json();
    setBtn('btn-main', p.main); setBtn('btn-chiller', p.chiller);
  } catch {}

  // history table
  const h = await (await fetch(`/history?limit=20&${bust()}`, NO_CACHE)).json();
  const tb = document.querySelector('#hist tbody'); if (tb) { tb.innerHTML = '';
    for (const r of h){
      const tr = document.createElement('tr');
      const dt = new Date(r.ts*1000).toLocaleString();
      tr.innerHTML = `<td>${dt}</td><td>${fmt(r.temp_c)}</td><td>${fmt(r.ph)}</td><td>${fmt(r.ec_ms_cm)}</td>`;
      tb.appendChild(tr);
    }
  }

  // relays
  await ensureRelayButtons();
  const rs = await (await fetch(`/relay/status?${bust()}`, NO_CACHE)).json();
  for(const n of RELAY_NAMES){ setBtn(`relay-${n}`, !!rs[n]); }
}
const RELAY_NAMES = ["ph_up","grow_pump","micro_pump","bloom_pump","main_pump","chiller_pump","water_chiller","grow_lights"];

function fmt(v){ return (v===null||v===undefined)?'—':Number(v).toFixed(3).replace(/\.000$/,''); }
function setBtn(id,on){ const b=document.getElementById(id); if(!b) return; b.className = 'relay ' + (on?'on':'off'); b.textContent = (on?'ON ':'OFF ') + b.dataset.label; }

async function toggleRelay(name){
  const st = await (await fetch(`/relay/status?${bust()}`, NO_CACHE)).json();
  const target = !st[name];
  await fetch(`/relay/${name}`, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({state: target?'on':'off'})});
  setTimeout(refresh, 300);
}

async function ensureRelayButtons(){
  const host = document.getElementById('relays');
  if(host.dataset.ready) return;
  host.dataset.ready = "1";
  for(const n of RELAY_NAMES){
    const label = n.replace('_',' ').replace('_',' ');
    const div = document.createElement('button');
    div.id = `relay-${n}`;
    div.dataset.label = label;
    div.className = 'relay off';
    div.onclick = () => toggleRelay(n);
    div.textContent = 'OFF ' + label;
    host.appendChild(div);
  }
}
function camRefresh(){
  const u = `http://${location.hostname}:8081/?action=stream&ts=${Date.now()}`;
  const cam = document.getElementById('cam');
  if (cam) cam.src = u;
}
// hook into existing refresh loop
(async function boot(){
  try { await updateCharts(); } catch(e){}
  setInterval(()=>{ updateCharts().catch(()=>{}); }, 10000); // 10s
})();

camRefresh();
refresh();
setInterval(() => { refresh().catch(()=>{}); }, 5000); // 5s refresh, ignore transient errors
</script>
</body>
</html>

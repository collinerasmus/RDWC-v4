[pytest]
# Collect tests only from tests/ directory
testpaths = tests
# Default options: real-time reporting of skipped/xfailed, durations for slow test triage, fail fast limited to 1
addopts = -ra --durations=25 --maxfail=1
filterwarnings = ignore::DeprecationWarning
markers =
	smoke: quick functional smoke test subset
	slow: longer-running automation / lock integration tests
timeout = 120

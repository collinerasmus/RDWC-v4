name: Daily Grow Report

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 07:00 UTC
  workflow_dispatch:

concurrency:
  group: daily-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336ab88eb53be0ee20997c673a1c6 # v4.1.1

      - name: Set up Python 3.11
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Daily Grow Report
        env:
          RDWC_HOST: ${{ secrets.RDWC_HOST }}
          RDWC_PORT: ${{ secrets.RDWC_PORT }}
        run: |
          python tools/generate_daily_report.py
        continue-on-error: true

      - name: Check if report was created
        run: |
          if [ -f grow-report.html ]; then
            echo "✅ Report generated successfully"
            ls -lh grow-report.html
          else
            echo "⚠️  Report generation failed, but continuing with email"
          fi

      - name: Send Email with Report
        if: ${{ env.EMAIL_SERVER != '' && env.EMAIL_USER != '' && env.EMAIL_PASSWORD != '' && env.EMAIL_TO != '' }}
        env:
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        uses: dawidd6/action-send-mail@6bdc42ec66008be01a190a2b51816b1c5470b7fc # v3.11.0
        with:
          server_address: ${{ env.EMAIL_SERVER }}
          server_port: ${{ env.EMAIL_PORT != '' && env.EMAIL_PORT || '587' }}
          username: ${{ env.EMAIL_USER }}
          password: ${{ env.EMAIL_PASSWORD }}
          subject: 'RDWC Daily Grow Report - ${{ github.event.repository.name }}'
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM != '' && env.EMAIL_FROM || env.EMAIL_USER }}
          body: |
            Your RDWC daily grow report is ready!
            
            ✅ Generated: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Open the attached HTML file in your browser for the full report with photos and charts.
          html_body: file://grow-report.html
          attachments: grow-report.html

      - name: Show Email Status
        if: always()
        run: |
          if [ "${{ secrets.EMAIL_SERVER }}" == "" ]; then
            echo "⚠️  EMAIL_SERVER secret not configured"
          fi
          if [ "${{ secrets.RDWC_HOST }}" == "" ]; then
            echo "⚠️  RDWC_HOST secret not configured"
          fi
          echo "✅ Workflow completed"
